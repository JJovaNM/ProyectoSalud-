name: Pruebas Proyecto Salud

# Se ejecuta con cada push y con cada pull request hacia main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Descarga el código del repositorio en la máquina de GitHub
      - name: Checkout repository
        uses: actions/checkout@v7

      # test -f comprueba que el archivo exista
      - name: Verificar archivos principales
        run: |
          echo "Verificando archivos..."
          test -f home/index.php
          test -f home/style.css
          test -f home/script.js
          test -f home/slider.css
          test -f README.md
          echo "Todos los archivos existen."

      # grep -qi busca el texto sin importar mayúsculas
      - name: Verificar estructura HTML
        run: |
          echo "Verificando estructura de home/index.php..."
          grep -qi "<html" home/index.php
          grep -qi "<head" home/index.php
          grep -qi "<body" home/index.php
          echo "home/index.php tiene estructura correcta."

      # Revisa que la página enlace su hoja de estilos y su script
      - name: Verificar referencias a CSS y JS
        run: |
          echo "Verificando referencias..."
          grep -q 'style.css' home/index.php
          grep -q 'script.js' home/index.php
          echo "Referencias encontradas."

      # php -l revisa errores de sintaxis sin ejecutar el código
      - name: Revisar sintaxis PHP
        run: |
          echo "Revisando sintaxis PHP..."
          php -l home/index.php

      # Revisa que composer.json esté bien escrito
      - name: Validar composer.json
        run: composer validate --no-check-publish

      # Evita que se suba el archivo .env con contraseñas
      - name: Verificar que no se subió .env
        run: |
          if [ -f .env ]; then
            echo "ERROR: el archivo .env no debe subirse al repositorio."
            exit 1
          fi
          echo "Correcto: .env no está en el repositorio."