name: testPush

# Revisa si existen cambios para registrar en la rama kikis.
on:
  push:
    branches: [kikis]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Archivos actualizados"